schema = 2
flash_bytes = 0x200000
erase_size = 0x1000

# Tuya BK7231T map. NET and LittleFS occupy the first part of user data,
# outside the bootloader's update area and before Tuya's retained data.
[native.regions]
bootloader = [0x000000, 0x011000]
application = [0x011000, 0x121000]
ota = [0x132000, 0x0A6000]
rf = [0x1E0000, 0x001000]
ble-bonding = [0x1E1000, 0x001000]
net = [0x1E3000, 0x001000]

[vendor]
tuya-kvs = [0x1D8000, 0x008000]
reserved = [0x1E2000, 0x001000]
tuya-data = [0x1ED000, 0x013000]

[filesystem]
offset = 0x1E4000
size = 0x09000

[image]
factory_format = "app-rbl"
application_address = 0x10000
application_container_size = 0x108700
application_coefficients = "510fb093a3cbeadc5993a17ec7adeb03"
ota_format = "rbl"
ota_compression = "gzip"
ota_encryption = "aes256"
ota_key = "0123456789ABCDEF0123456789ABCDEF"
ota_iv = "0123456789ABCDEF"
