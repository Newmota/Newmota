[project]
name = "newmota"
version = "0.0.1"
description = "Newmota multi-platform firmware"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "blflashcommand @ git+https://github.com/Staars/blflashcommand@968427c6a2bd18f2f8ee85bc4743c07e653ab9d7",
  "bflb-fw-post-proc==1.4.5",
  "bk7231tools==2.1.2",
  "brotli==1.2.0",
  "littlefs-python==0.18.0",
  "pycryptodome>=3.20",
  "pyserial==3.5",
  "pyyaml>=6.0",
  "rcssmin==1.3.0",
  "rjsmin==1.3.0",
  "tomli>=2.2.1; python_version < '3.11'",
  "zopfli==0.4.3",
]

[project.optional-dependencies]
dev = [
  "clang-format==22.1.8",
  "ruff>=0.8",
]

[tool.uv]
managed = true
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
